[workspace]
resolver = "2"
members = [
    "crates/qoi-rs",
    "crates/qoi-sys",
    "crates/qoi-cabi",
    "crates/qoi-diff",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/phoboslab/qoi"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

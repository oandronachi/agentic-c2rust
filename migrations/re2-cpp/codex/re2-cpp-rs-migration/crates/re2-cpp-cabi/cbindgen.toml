language = "C"
pragma_once = true
include_guard = "RE2_CPP_RS_H"
autogen_warning = "/* Generated by cbindgen for re2-cpp-cabi. */"
include_version = false
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[parse]
parse_deps = false

[export]
include = [
    "Re2CppRegex",
    "re2_cpp_rs_new",
    "re2_cpp_rs_free",
    "re2_cpp_rs_partial_match",
]

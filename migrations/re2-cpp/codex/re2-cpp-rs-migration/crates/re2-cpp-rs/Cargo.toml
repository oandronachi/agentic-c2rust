[package]
name = "re2-cpp-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["ffi"]
ffi = ["dep:re2-cpp-sys"]

[dependencies]
re2-cpp-sys = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.kani.flags]
default-unwind = "8"

[[bench]]
name = "bench"
harness = false
